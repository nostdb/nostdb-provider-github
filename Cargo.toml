[package]
name = "nostdb-provider-github"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "NostDB GitHub source and graph-store provider: an out-of-process executable that retrieves bytes and metadata over the versioned provider protocol."
publish = false

[lib]
name = "nostdb_provider_github"
path = "src/lib.rs"

[[bin]]
name = "nostdb-provider-github"
path = "src/main.rs"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
missing_errors_doc = "deny"
missing_panics_doc = "deny"

# Dependency review:
#
# serde_json  Purpose: the provider protocol is line-delimited JSON, and GitHub's API answers
#             in JSON. Widely used, actively maintained by the Serde maintainers, dual
#             MIT/Apache-2.0. Every sibling crate in this workspace already depends on it, so
#             it adds nothing to the workspace's overall surface.
#
# sha2        Purpose: the digest a materialize reply carries, so the Engine has something to
#             check the artifact against. Maintained by the RustCrypto project, dual
#             MIT/Apache-2.0, and already a dependency of nostdb-core — the same algorithm
#             computed by the same implementation on both sides of the check.
#
#             Hand-writing SHA-256 to avoid a dependency the workspace already uses
#             everywhere would trade a reviewed implementation for an unreviewed one, at a
#             place where being wrong is silent.
#
# ureq        Purpose: the one implementation of the `Http` trait that actually reaches
#             GitHub. Maintained by the algesten/ureq project, dual MIT/Apache-2.0.
#
#             Chosen over `reqwest` because this provider is synchronous by design: it reads
#             one request line, answers it, and reads the next. `reqwest` is async first and
#             would bring an executor into a program with nothing to schedule — a runtime,
#             its dependency tree, and a class of bug (a blocked reactor, a runtime nested in
#             a runtime) that a line-oriented process has no reason to own.
#
#             It reaches TLS through rustls rather than the platform's OpenSSL, so a build
#             does not depend on what a machine happens to have installed. That matters more
#             than usual here: this executable is bundled into official distributions, so a
#             link-time dependency on a system library would be a support burden on every
#             platform it ships to.
#
#             Confined to `src/client.rs`. Everything else speaks the `Http` trait, so
#             replacing this is one file and no test changes — which is what the trait was
#             for and is the reason this choice did not have to be made earlier.
#
# What this crate must not take a dependency on is `nostdb-core`. A provider retrieves bytes
# and metadata; only the Engine interprets `.nost` or `.nostdb`. Linking the Engine would
# make it possible to parse either by accident, and the ownership boundary exists precisely
# because that possibility is what a second parser grows out of.
[dependencies]
serde_json = "1"
sha2 = "0.10"
ureq = "3"
